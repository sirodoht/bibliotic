            :root {
                --bg-primary: #faf8f5;

                --text-primary: #1a1a1a;
                --text-secondary: #4a4a4a;
                --text-muted: #7a7a7a;
                --accent: #8b4513;
                --accent-light: #a0522d;
                --accent-dark: #5c2d0c;
                --accent-pale: #d4a574;
                --border: #e0d8cc;
                --shadow: rgba(0, 0, 0, 0.06);
                --shadow-strong: rgba(0, 0, 0, 0.1);
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: system-ui, -apple-system, sans-serif;
                background: var(--bg-primary);
                color: var(--text-primary);
                line-height: 1.6;
                overflow: hidden;
            }

            #map {
                width: 100%;
                height: 100vh;
                height: 100svh;
            }

            .bookstore-name {
                font-family: serif;
                font-size: 1.5rem;
                font-weight: 400;
                color: var(--text-primary);
                line-height: 1.3;
                margin-bottom: 0.25rem;
                padding-right: 1.5rem;
            }

            .bookstore-subtitle {
                font-family: serif;
                color: var(--text-muted);
                margin-bottom: 0.25rem;
            }

            .bookstore-address {
                display: block;
                font-size: 0.875rem;
                color: var(--text-muted);
                text-decoration: none;
            }

            a.bookstore-address:hover {
                color: var(--accent);
                text-decoration: underline;
            }

            .bookstore-address .arrow {
                margin-left: 0.25em;
            }

            /* Bookstore Card */
            .card {
                position: fixed;
                top: 16px;
                left: 16px;
                width: 360px;
                max-height: calc(100% - 32px);
                overflow-y: auto;
                background: var(--bg-primary);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 1.25rem;
                box-shadow: 0 4px 24px var(--shadow-strong);
                z-index: 10;
            }

            .card[hidden] {
                display: none;
            }

            .card-close {
                position: absolute;
                top: 0.625rem;
                right: 0.625rem;
                width: 1.75rem;
                height: 1.75rem;
                border: none;
                background: transparent;
                color: var(--text-muted);
                font-size: 1.25rem;
                line-height: 1;
                cursor: pointer;
            }

            .card-close:hover {
                color: var(--text-primary);
            }

            @media (max-width: 480px) {
                .card {
                    width: auto;
                    right: 16px;
                }
            }

            /* Near me button */
            .mapboxgl-ctrl-group button.mapboxgl-ctrl-geolocate {
                width: 48px;
                height: 48px;
            }

            .mapboxgl-ctrl-geolocate .mapboxgl-ctrl-icon {
                background-size: 40px;
            }

            /* Custom Marker */
            .custom-marker {
                width: 14px;
                height: 14px;
                background: var(--accent);
                border: 2px solid white;
                border-radius: 50%;
                cursor: pointer;
                box-shadow: 0 1px 4px var(--shadow-strong);
                transition: width 0.15s ease, height 0.15s ease, background 0.15s ease;
            }

            /* Size changes stay centred because markers are anchored at their centre */
            .custom-marker:hover {
                width: 18px;
                height: 18px;
            }

            .custom-marker.active {
                width: 22px;
                height: 22px;
                border-width: 3px;
                background: var(--accent-dark);
                z-index: 1;
            }
        </style>
    </head>

            let map;

            document.addEventListener('DOMContentLoaded', () => {
                initMap();
                DATA.bookstores.forEach(data => {
                    if (data.coordinates) createMarker(data);
                });
            });

            function initMap() {
                mapboxgl.accessToken = "pk.eyJ1Ijoic2lyb2RvaHQiLCJhIjoiY203aXlsMHY1MDFtMDJrc2FpM2M0bXJyNyJ9.ymB7vRZzN8H6R1xTPKJfNg";

                map = new mapboxgl.Map({
                    container: "map",
                    style: "mapbox://styles/mapbox/light-v10",
                    center: [-0.12, 51.515],
                    zoom: 12.5,
                    locale: {
                        "GeolocateControl.FindMyLocation": "Near me",
                    },
                });

                map.addControl(new mapboxgl.NavigationControl(), "bottom-right");
                map.addControl(new mapboxgl.GeolocateControl({
                    positionOptions: { enableHighAccuracy: true },
                    trackUserLocation: true,
                    showUserHeading: true,
                }), "bottom-right");

                // Clicking empty map closes the card
                map.on("click", closeCard);
                document.querySelector(".card-close").addEventListener("click", closeCard);
            }

            function openCard(data, el) {
                document.getElementById("card-content").innerHTML = createCardHTML(data);
                document.getElementById("card").hidden = false;
                document.querySelectorAll(".custom-marker.active").forEach(m => m.classList.remove("active"));
                el.classList.add("active");
            }

            function closeCard() {
                document.getElementById("card").hidden = true;
                document.querySelectorAll(".custom-marker.active").forEach(m => m.classList.remove("active"));
            }

            function createCardHTML(data) {
                let html = `<h3 class="bookstore-name">${data.name}</h3>`;

                if (data.subtitle) {
                    html += `<p class="bookstore-subtitle">${data.subtitle}</p>`;
                }

                if (data.address && data.googleMapsLink) {
                    html += `<a class="bookstore-address" href="${data.googleMapsLink}" target="_blank" rel="noopener" title="Open in Google Maps">${data.address}<span class="arrow">↗</span></a>`;
                } else if (data.address) {
                    html += `<p class="bookstore-address">${data.address}</p>`;
                }

                return html;
            }

            function createMarker(data) {
                const el = document.createElement('div');
                el.className = 'custom-marker';
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openCard(data, el);
                });

                return new mapboxgl.Marker({ element: el })
                    .setLngLat(data.coordinates)
                    .addTo(map);
            }
