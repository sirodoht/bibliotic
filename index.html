        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/mapbox-gl/2.15.0/mapbox-gl.js"></script>

            :root {
                --bg-primary: #faf8f5;
                --bg-secondary: #f5f1eb;
                --bg-tertiary: #efe9e1;
                --text-primary: #1a1a1a;
                --text-secondary: #4a4a4a;
                --text-muted: #7a7a7a;
                --accent: #8b4513;
                --accent-light: #a0522d;
                --accent-pale: #d4a574;
                --border: #e0d8cc;
                --shadow: rgba(0, 0, 0, 0.06);
                --shadow-strong: rgba(0, 0, 0, 0.1);
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Inter', -apple-system, sans-serif;
                background: var(--bg-primary);
                color: var(--text-primary);
                min-height: 100vh;
                line-height: 1.6;
            }

            /* Header */
            header {
                padding: 4rem 2rem 3rem;
                text-align: center;
                background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
                border-bottom: 1px solid var(--border);
            }

            h1 {
                font-family: 'Cormorant Garamond', Georgia, serif;
                font-size: clamp(3rem, 8vw, 5rem);
                font-weight: 500;
                letter-spacing: -0.02em;
                color: var(--text-primary);
                margin-bottom: 0.75rem;
            }

            .subtitle {
                font-family: 'Cormorant Garamond', Georgia, serif;
                font-size: 1.25rem;
                font-style: italic;
                color: var(--text-muted);
                font-weight: 400;
            }

            /* Container */
            .container {
                max-width: 1600px;
                margin: 0 auto;
                padding: 0 2rem;
            }

            @media (max-width: 768px) {
                .container {
                    padding: 0 1rem;
                }
                
                header {
                    padding: 2.5rem 1rem 2rem;
                }
            }

            /* Map Section */
            .map-section {
                margin: 3rem 0;
                border-radius: 8px;
                overflow: hidden;
                box-shadow: 0 4px 24px var(--shadow-strong);
                background: var(--bg-secondary);
                border: 1px solid var(--border);
            }

            #map {
                width: 100%;
                height: 500px;
            }

            .map-controls {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 1rem 1.5rem;
                background: var(--bg-secondary);
                border-top: 1px solid var(--border);
            }

            .map-control-btn {
                background: transparent;
                color: var(--text-secondary);
                border: 1px solid var(--border);
                padding: 0.5rem 1rem;
                font-size: 0.875rem;
                cursor: pointer;
                transition: all 0.2s ease;
                border-radius: 4px;
                font-family: 'Inter', sans-serif;
            }

            .map-control-btn:hover {
                background: var(--bg-tertiary);
                border-color: var(--accent-pale);
            }

            /* Filter Section */
            .filter-section {
                margin-bottom: 2rem;
                padding: 1.5rem;
                background: var(--bg-secondary);
                border-radius: 8px;
                border: 1px solid var(--border);
            }

            .filter-grid {
                display: grid;
                grid-template-columns: 1fr auto auto;
                gap: 1.5rem;
                align-items: start;
            }

            @media (max-width: 1024px) {
                .filter-grid {
                    grid-template-columns: 1fr;
                }
            }

            .search-box {
                position: relative;
            }

            .search-box input {
                width: 100%;
                padding: 0.75rem 2.5rem 0.75rem 1rem;
                border: 1px solid var(--border);
                border-radius: 6px;
                background: var(--bg-primary);
                color: var(--text-primary);
                font-size: 0.9375rem;
                font-family: 'Inter', sans-serif;
                transition: all 0.2s ease;
            }

            .search-box input:focus {
                outline: none;
                border-color: var(--accent-pale);
                box-shadow: 0 0 0 3px rgba(139, 69, 19, 0.08);
            }

            .clear-search-btn {
                position: absolute;
                right: 0.75rem;
                top: 50%;
                transform: translateY(-50%);
                background: none;
                border: none;
                color: var(--text-muted);
                font-size: 1.25rem;
                cursor: pointer;
                display: none;
                padding: 0;
                width: 24px;
                height: 24px;
                line-height: 24px;
            }

            .search-box input:not(:placeholder-shown) + .clear-search-btn {
                display: block;
            }

            .filter-tags {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .filter-btn {
                background: var(--bg-primary);
                color: var(--text-secondary);
                border: 1px solid var(--border);
                padding: 0.5rem 0.875rem;
                font-size: 0.8125rem;
                cursor: pointer;
                transition: all 0.2s ease;
                border-radius: 4px;
                font-family: 'Inter', sans-serif;
                font-weight: 500;
            }

            .filter-btn:hover {
                background: var(--bg-tertiary);
                border-color: var(--accent-pale);
            }

            .filter-btn.active {
                background: var(--accent);
                color: white;
                border-color: var(--accent);
            }

            .sort-select {
                padding: 0.75rem 1rem;
                border: 1px solid var(--border);
                border-radius: 6px;
                background: var(--bg-primary);
                color: var(--text-primary);
                font-size: 0.875rem;
                font-family: 'Inter', sans-serif;
                cursor: pointer;
            }

            .location-filters {
                margin-top: 1rem;
                padding-top: 1rem;
                border-top: 1px solid var(--border);
            }

            .location-label {
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                color: var(--text-muted);
                margin-bottom: 0.75rem;
                font-weight: 500;
            }

            .location-buttons {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .location-btn {
                background: transparent;
                color: var(--text-secondary);
                border: 1px solid transparent;
                padding: 0.375rem 0.75rem;
                font-size: 0.8125rem;
                cursor: pointer;
                transition: all 0.2s ease;
                border-radius: 4px;
                font-family: 'Inter', sans-serif;
            }

            .location-btn:hover {
                background: var(--bg-tertiary);
            }

            .location-btn.active {
                background: var(--bg-tertiary);
                color: var(--accent);
                border-color: var(--accent-pale);
            }

            /* Results Count */
            .results-count {
                text-align: center;
                margin-bottom: 2rem;
                color: var(--text-muted);
                font-size: 0.9375rem;
            }

            /* Bookstore Grid */
            .bookstore-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
                gap: 1.5rem;
                margin-bottom: 4rem;
            }

            @media (max-width: 768px) {
                .bookstore-grid {
                    grid-template-columns: 1fr;
                }
            }

            .bookstore-card {
                background: var(--bg-primary);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 1.75rem;
                transition: all 0.25s ease;
                position: relative;
            }

            .bookstore-card:hover {
                box-shadow: 0 8px 32px var(--shadow-strong);
                transform: translateY(-2px);
            }

            .bookstore-card.highlighted {
                border-color: var(--accent);
                box-shadow: 0 0 0 3px rgba(139, 69, 19, 0.1);
            }

            .bookstore-header {
                margin-bottom: 1rem;
            }

            .bookstore-name {
                font-family: 'Cormorant Garamond', Georgia, serif;
                font-size: 1.5rem;
                font-weight: 600;
                color: var(--text-primary);
                margin-bottom: 0.5rem;
                line-height: 1.3;
            }

            .bookstore-address {
                font-size: 0.875rem;
                color: var(--text-muted);
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }

            .bookstore-address::before {
                content: "📍";
                font-size: 0.75rem;
            }

            .tag-container {
                display: flex;
                flex-wrap: wrap;
                gap: 0.375rem;
                margin-bottom: 1rem;
            }

            .tag {
                background: var(--bg-secondary);
                color: var(--accent);
                padding: 0.25rem 0.625rem;
                border-radius: 4px;
                font-size: 0.6875rem;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                border: 1px solid var(--border);
            }

            .reviews-section {
                margin-top: 1rem;
                padding-top: 1rem;
                border-top: 1px solid var(--border);
            }

            .review {
                margin-bottom: 1rem;
            }

            .review:last-child {
                margin-bottom: 0;
            }

            .review-text {
                font-family: 'Cormorant Garamond', Georgia, serif;
                font-size: 1rem;
                font-style: italic;
                color: var(--text-secondary);
                line-height: 1.6;
                margin-bottom: 0.375rem;
            }

            .reviewer {
                font-size: 0.8125rem;
                color: var(--text-muted);
                font-weight: 500;
            }

            .card-actions {
                display: flex;
                gap: 0.75rem;
                margin-top: 1.25rem;
            }

            .btn {
                display: inline-flex;
                align-items: center;
                gap: 0.375rem;
                padding: 0.625rem 1rem;
                font-size: 0.8125rem;
                font-weight: 500;
                border-radius: 6px;
                cursor: pointer;
                transition: all 0.2s ease;
                text-decoration: none;
                font-family: 'Inter', sans-serif;
            }

            .btn-primary {
                background: var(--accent);
                color: white;
                border: 1px solid var(--accent);
            }

            .btn-primary:hover {
                background: var(--accent-light);
                border-color: var(--accent-light);
            }

            .btn-secondary {
                background: var(--bg-secondary);
                color: var(--text-secondary);
                border: 1px solid var(--border);
            }

            .btn-secondary:hover {
                background: var(--bg-tertiary);
                border-color: var(--accent-pale);
            }

            .no-results {
                text-align: center;
                padding: 4rem 2rem;
                color: var(--text-muted);
                grid-column: 1 / -1;
            }

            .no-results h3 {
                font-family: 'Cormorant Garamond', Georgia, serif;
                font-size: 1.5rem;
                color: var(--text-secondary);
                margin-bottom: 0.5rem;
            }

            /* Footer */
            footer {
                text-align: center;
                padding: 3rem 2rem;
                border-top: 1px solid var(--border);
                background: var(--bg-secondary);
                color: var(--text-muted);
                font-size: 0.9375rem;
            }

            footer a {
                color: var(--accent);
                text-decoration: none;
                font-weight: 500;
            }

            footer a:hover {
                text-decoration: underline;
            }

            /* Mapbox Popup Styling */
            .mapboxgl-popup-content {
                background: var(--bg-primary);
                border-radius: 8px;
                padding: 1rem;
                box-shadow: 0 4px 24px var(--shadow-strong);
                border: 1px solid var(--border);
            }

            .mapboxgl-popup-close-button {
                color: var(--text-muted);
                font-size: 1.25rem;
                padding: 0.5rem;
            }

            /* Custom Marker */
            .custom-marker {
                width: 32px;
                height: 32px;
                background: var(--accent);
                border: 3px solid white;
                border-radius: 50% 50% 50% 0;
                transform: rotate(-45deg);
                cursor: pointer;
                box-shadow: 0 2px 8px var(--shadow-strong);
                transition: transform 0.2s ease;
            }

            .custom-marker:hover {
                transform: rotate(-45deg) scale(1.1);
            }
        </style>
    </head>

        <header>

        <div class="container">

                    <button id="scroll-zoom-toggle" class="map-control-btn">
                        Enable Scroll Zoom

                </div>
            </div>

            <div class="filter-section">
                <div class="filter-grid">
                    <div class="search-box">

                        <button id="clear-search" class="clear-search-btn">×</button>
                    </div>
                    <div class="filter-tags">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="new books">New Books</button>

                        <button class="filter-btn" data-filter="rare books">Rare Books</button>
                        <button class="filter-btn" data-filter="queer books">Queer Books</button>
                        <button class="filter-btn" data-filter="political books">Political</button>
                    </div>
                    <select id="sort-select" class="sort-select">
                        <option value="name-asc">Name (A–Z)</option>
                        <option value="name-desc">Name (Z–A)</option>
                    </select>
                </div>
                <div class="location-filters">
                    <div class="location-label">Filter by Area</div>
                    <div class="location-buttons">
                        <button class="location-btn active" data-area="all">All Areas</button>
                        <button class="location-btn" data-area="central">Central</button>
                        <button class="location-btn" data-area="north">North</button>
                        <button class="location-btn" data-area="south">South</button>
                        <button class="location-btn" data-area="east">East</button>
                        <button class="location-btn" data-area="west">West</button>
                    </div>
                </div>
            </div>

            <div class="results-count" id="results-count"></div>

            <div class="bookstore-grid" id="bookstore-grid">
            </div>
        </div>

        <footer>
            <p>
                Contribute by adding your review or a bookstore we're missing.
                <a href="https://github.com/sirodoht/bibliotic" target="_blank">Open a PR on GitHub →</a>
            </p>
        </footer>

                });

                map.scrollZoom.disable();
                map.addControl(new mapboxgl.NavigationControl());

                // Scroll zoom toggle
                const scrollZoomToggle = document.getElementById("scroll-zoom-toggle");
                let scrollZoomEnabled = false;

                const isTouchDevice = () => {
                    return "ontouchstart" in window || navigator.maxTouchPoints > 0;
                };

                if (isTouchDevice()) {
                    scrollZoomToggle.style.display = "none";
                } else {
                    scrollZoomToggle.addEventListener("click", () => {
                        if (scrollZoomEnabled) {
                            map.scrollZoom.disable();
                            scrollZoomToggle.textContent = "Enable Scroll Zoom";
                            scrollZoomEnabled = false;
                        } else {
                            map.scrollZoom.enable();
                            scrollZoomToggle.textContent = "Disable Scroll Zoom";
                            scrollZoomEnabled = true;
                        }
                    });
                }
            }

            function initBookstores() {
                const grid = document.getElementById('bookstore-grid');
                
                DATA.bookstores.forEach((data, index) => {
                    const card = createBookstoreCard(data, index);
                    grid.appendChild(card.element);
                    
                    bookstores.push({
                        data: data,
                        element: card.element,
                        marker: null
                    });

                    // Create marker if coordinates exist
                    if (data.coordinates) {
                        const marker = createMarker(data, card.element);
                        bookstores[index].marker = marker;
                        markers.push(marker);
                    }
                });
            }

            function createBookstoreCard(data, index) {
                const element = document.createElement('div');
                element.className = 'bookstore-card';
                element.dataset.index = index;
                
                let html = `
                    <div class="bookstore-header">
                        <h3 class="bookstore-name">${data.name}</h3>
                        ${data.address ? `<p class="bookstore-address">${data.address}</p>` : ''}
                    </div>
                `;

                if (data.tags && data.tags.length > 0) {
                    html += '<div class="tag-container">';
                    data.tags.forEach(tag => {
                        html += `<span class="tag">${tag}</span>`;
                    });
                    html += '</div>';
                }

                if (data.reviews && data.reviews.length > 0) {
                    html += '<div class="reviews-section">';
                    data.reviews.forEach(review => {
                        html += `
                            <div class="review">
                                <p class="review-text">"${review.text}"</p>
                                <p class="reviewer">— ${review.reviewer}</p>
                            </div>
                        `;
                    });
                    html += '</div>';
                }

                html += '<div class="card-actions">';
                
                if (data.coordinates) {
                    html += `<button class="btn btn-primary" onclick="locateOnMap(${index})">Locate on Map</button>`;
                }
                
                if (data.googleMapsLink) {
                    html += `<a href="${data.googleMapsLink}" target="_blank" class="btn btn-secondary">Open in Maps</a>`;
                }
                
                html += '</div>';

                element.innerHTML = html;
                return { element };
            }

            function createMarker(data, cardElement) {
                const el = document.createElement('div');
                el.className = 'custom-marker';

                const marker = new mapboxgl.Marker({ element: el })
                    .setLngLat(data.coordinates)
                    .setPopup(
                        new mapboxgl.Popup().setHTML(`
                            <h3 style="font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; margin-bottom: 0.5rem; color: var(--text-primary);">
                                ${data.name}
                            </h3>
                            <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 0.75rem;">
                                ${data.address || ''}
                            </p>
                            <button onclick="highlightFromMap('${data.name}')" style="
                                background: var(--accent);
                                color: white;
                                border: none;
                                padding: 0.5rem 0.75rem;
                                font-size: 0.8125rem;
                                cursor: pointer;
                                border-radius: 4px;
                                font-family: 'Inter', sans-serif;
                            ">View details</button>
                        `)
                    )
                    .addTo(map);

                return marker;
            }

            function initFilters() {
                // Search
                const searchInput = document.getElementById('search-input');
                const clearSearchBtn = document.getElementById('clear-search');

                searchInput.addEventListener('input', (e) => {
                    searchTerm = e.target.value;
                    updateBookstoreList();
                });

                clearSearchBtn.addEventListener('click', () => {
                    searchInput.value = '';
                    searchTerm = '';
                    updateBookstoreList();
                    searchInput.focus();
                });

                // Tag filters
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentFilter = btn.dataset.filter;
                        updateBookstoreList();
                    });
                });

                // Location filters
                document.querySelectorAll('.location-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.location-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentLocation = btn.dataset.area;
                        updateBookstoreList();
                    });
                });

                // Sort
                document.getElementById('sort-select').addEventListener('change', (e) => {
                    currentSort = e.target.value;
                    updateBookstoreList();
                });
            }

            function updateBookstoreList() {
                const grid = document.getElementById('bookstore-grid');
                const resultsCount = document.getElementById('results-count');
                
                // Filter
                const filtered = bookstores.filter(bs => {
                    const data = bs.data;
                    
                    // Tag filter
                    const tagMatch = currentFilter === 'all' || 
                        (data.tags && data.tags.includes(currentFilter));
                    
                    // Search filter
                    const searchMatch = !searchTerm || 
                        data.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        (data.address && data.address.toLowerCase().includes(searchTerm.toLowerCase()));
                    
                    // Location filter
                    const locationMatch = currentLocation === 'all' || checkLocation(data.address, currentLocation);
                    
                    // Update marker visibility
                    if (bs.marker) {
                        bs.marker.getElement().style.display = (tagMatch && searchMatch && locationMatch) ? 'block' : 'none';
                    }
                    
                    return tagMatch && searchMatch && locationMatch;
                });

                // Sort
                filtered.sort((a, b) => {
                    if (currentSort === 'name-asc') {
                        return a.data.name.localeCompare(b.data.name);
                    } else {
                        return b.data.name.localeCompare(a.data.name);
                    }
                });

                // Update grid
                grid.innerHTML = '';
                
                if (filtered.length === 0) {
                    grid.innerHTML = `
                        <div class="no-results">
                            <h3>No bookstores found</h3>
                            <p>Try adjusting your filters or search terms.</p>
                        </div>
                    `;
                } else {
                    filtered.forEach(bs => {
                        grid.appendChild(bs.element);
                    });
                }

                // Update count
                resultsCount.textContent = `Showing ${filtered.length} of ${bookstores.length} bookstores`;
            }

            function checkLocation(address, area) {
                if (!address) return false;
                const addr = address.toLowerCase();
                
                const areas = {
                    east: ['e1', 'e2', 'e3', 'e5', 'e8', 'e14'],
                    west: ['w1', 'w2', 'w6', 'w8', 'w11', 'sw3', 'sw6', 'sw7'],
                    north: ['n1', 'n5', 'n10', 'nw1', 'nw3', 'nw5', 'nw6', 'nw11'],
                    south: ['se1', 'se3', 'se5', 'se8', 'se14', 'se22', 'sw12'],
                    central: ['wc1', 'wc2', 'ec1', 'ec2', 'ec3', 'ec4']
                };
                
                return areas[area].some(code => addr.includes(code));
            }

            // Global functions for onclick handlers
            window.locateOnMap = function(index) {
                const bs = bookstores[index];
                if (!bs || !bs.data.coordinates) return;

                // Close all popups
                markers.forEach(m => {
                    if (m.getPopup().isOpen()) m.togglePopup();
                });

                // Fly to location
                map.flyTo({
                    center: bs.data.coordinates,
                    zoom: 15,
                    essential: true
                });

                // Highlight card
                document.querySelectorAll('.bookstore-card').forEach(c => c.classList.remove('highlighted'));
                bs.element.classList.add('highlighted');

                // Open popup
                setTimeout(() => {
                    bs.marker.togglePopup();
                }, 500);

                // Scroll to map on mobile
                if (window.innerWidth <= 768) {
                    document.querySelector('.map-section').scrollIntoView({ behavior: 'smooth' });
                }
            };

            window.highlightFromMap = function(name) {
                const bs = bookstores.find(b => b.data.name === name);
                if (bs) {
                    document.querySelectorAll('.bookstore-card').forEach(c => c.classList.remove('highlighted'));
                    bs.element.classList.add('highlighted');
                    bs.element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    
                    setTimeout(() => {
                        bs.element.classList.remove('highlighted');
                    }, 3000);
                }
            };
        </script>
    </body>
</html>
