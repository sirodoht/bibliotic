        <style>
            :root {
                --black: #000000;
                --white: #ffffff;
                --accent: #94a684; /* sage green */
                --accent2: #b5c99a; /* lighter sage */
                --accent3: #cfe1b9; /* palest sage */
                --earth1: #e4c988; /* warm sand */
                --earth2: #a47e3b; /* aged bronze */
                --earth3: #54442b; /* deep umber */
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: "Segoe UI", system-ui, sans-serif;
            }

            body {
                background: var(--black);
                color: var(--white);
                min-height: 100vh;
                position: relative;
                overflow-x: hidden;
            }

            body::before {
                content: "";
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: repeating-linear-gradient(
                    45deg,
                    var(--black),
                    var(--black) 20px,
                    rgba(148, 166, 132, 0.1) 20px,
                    rgba(148, 166, 132, 0.1) 40px
                );
                z-index: -1;
            }

            /* Header section */
            header {
                padding: 4rem 2rem;
                text-align: center;
                position: relative;
                background: var(--black);
                margin-bottom: 16px;
            }

            @media (max-width: 768px) {
                header {
                    padding: 2rem 1rem;
                    margin-bottom: 8px;
                }
            }

            /* Footer section */
            footer {
                color: var(--earth2);
                text-align: center;
                padding: 16px 0 32px;
            }

            footer a {
                color: var(--earth1);
            }

            /* Main title */
            h1 {
                font-size: 5rem;
                font-weight: 900;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                position: relative;
                display: inline-block;
                color: var(--white);
                margin-bottom: 1rem;
                text-shadow:
                    -1px -1px 0 var(--accent),
                    1px -1px 0 var(--accent),
                    -1px 1px 0 var(--accent),
                    1px 1px 0 var(--accent),
                    4px 4px 0 var(--black),
                    8px 8px 0 var(--earth1);
                transform: skew(-5deg);
                transition: transform 0.3s ease;
            }

            @media (max-width: 768px) {
                h1 {
                    font-size: 2.5rem;
                    letter-spacing: 0.1em;
                    margin-bottom: 0.5rem;
                    text-shadow:
                        -1px -1px 0 var(--accent),
                        1px -1px 0 var(--accent),
                        -1px 1px 0 var(--accent),
                        1px 1px 0 var(--accent),
                        2px 2px 0 var(--black),
                        4px 4px 0 var(--earth1);
                }
            }

            /* Subtitle */
            .subtitle {
                font-size: 1.2rem;
                text-transform: uppercase;
                letter-spacing: 0.5em;
                color: var(--earth1);
                text-shadow: 2px 2px var(--earth3);
            }

            @media (max-width: 768px) {
                .subtitle {
                    font-size: 1rem;
                    letter-spacing: 0.3em;
                }
            }

            /* Full width container */
            .container {
                width: 100%;
                max-width: 1800px;
                margin: 0 auto;
                padding: 0;
            }

            /* Map section */
            .map-section {
                width: 100%;
                height: 70vh;
                min-height: 600px;
                position: relative;
                margin-bottom: 3rem;
            }

            #map {
                width: 100%;
                height: 100%;
                border-bottom: 4px solid var(--white);
            }

            /* Map control button */
            .map-control-btn {
                position: absolute;
                bottom: 34px;
                right: 10px;
                background: var(--black);
                color: var(--accent);
                border: 2px solid var(--accent);
                padding: 8px 12px;
                z-index: 10;
                cursor: pointer;
                transition: all 0.3s ease;
                font-size: 0.9rem;
            }

            .map-control-btn:hover {
                background: var(--accent);
                color: var(--black);
            }

            /* Bookstore list section */
            .bookstore-list {
                padding: 2rem;
                max-width: 1400px;
                margin: 0 auto;
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 2rem;
            }

            @media (max-width: 768px) {
                .bookstore-list {
                    grid-template-columns: 1fr;
                    padding: 0.5rem;
                    gap: 1rem;
                }
            }

            .bookstore-card {
                display: flex;
                flex-direction: column;
                height: 100%;
                background: var(--white);
                color: var(--black);
                padding: 2rem;
                transform-origin: center;
                transition: all 0.3s ease;
                position: relative;
                border-left: 8px solid var(--earth2);
            }

            @media (max-width: 768px) {
                .bookstore-card {
                    padding: 1.5rem;
                    margin: 0 0.5rem;
                }
            }

            .bookstore-name {
                font-size: 2rem;
                font-weight: 900;
                text-transform: uppercase;
                margin-bottom: 1rem;
                color: var(--earth3);
                border-bottom: 4px solid var(--accent);
                display: inline-block;
                padding-bottom: 0.5rem;
                transition: color 0.3s ease;
            }

            @media (max-width: 768px) {
                .bookstore-name {
                    font-size: 1.5rem;
                    margin-bottom: 0.75rem;
                }
            }

            .bookstore-address {
                font-family: monospace;
                font-size: 1rem;
                color: var(--earth2);
                margin-bottom: 1rem;
                padding-left: 1rem;
                border-left: 4px solid var(--accent2);
            }

            .google-maps-link {
                display: block;
                margin-top: 0.5rem;
                color: var(--earth3);
                text-decoration: none;
                transition: color 0.3s ease;
                margin: 0;
            }

            .google-maps-link:hover {
                text-decoration: underline;
            }

            /* Tags styling */
            .tag-container {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .tag {
                background: var(--accent3);
                color: var(--earth3);
                padding: 0.3rem 0.8rem;
                border-radius: 2px;
                font-size: 0.9rem;
                font-weight: 500;
                transition: all 0.3s ease;
            }

            /* Reviews styling */
            .reviews-toggle {
                background: none;
                border: 2px solid var(--accent);
                color: var(--accent);
                padding: 0.5rem 1rem;
                font-size: 0.9rem;
                cursor: pointer;
                transition: all 0.3s ease;
                margin-bottom: 1rem;
            }

            .reviews-toggle:hover {
                background: var(--accent);
                color: var(--white);
            }

            .reviews-container {
                border-left: 3px solid var(--accent3);
                padding-left: 1rem;
                margin: 1rem 0;
            }

            .review {
                margin-bottom: 1rem;
                padding-bottom: 1rem;
                border-bottom: 1px solid var(--accent3);
            }

            .review:last-child {
                border-bottom: none;
                margin-bottom: 0;
                padding-bottom: 0;
            }

            .review-text {
                color: var(--earth3);
                font-style: italic;
                margin-bottom: 0.5rem;
                line-height: 1.4;
            }

            .reviewer {
                color: var(--earth2);
                font-size: 0.9rem;
                text-align: right;
            }

            /* Update card padding for new content */
            .bookstore-card {
                padding: 2rem;
            }

            /* Filter controls styling */
            .filter-container {
                background: var(--black);
                padding: 1rem 2rem;
                margin-bottom: 2rem;
                border-bottom: 1px solid var(--accent);
            }

            @media (max-width: 768px) {
                .filter-container {
                    padding: 0.5rem 1rem;
                }
            }

            .filter-controls {
                display: flex;
                flex-wrap: wrap;
                gap: 1rem;
                align-items: center;
                justify-content: space-between;
                max-width: 1400px;
                margin: 0 auto;
            }

            @media (max-width: 768px) {
                .filter-controls {
                    gap: 0.75rem;
                }
            }

            .search-box {
                position: relative;
                display: flex;
                align-items: center;
            }

            .search-box input {
                padding: 0.5rem 1rem;
                border: 2px solid var(--accent);
                background: var(--black);
                color: var(--white);
                min-width: 250px;
            }

            @media (max-width: 768px) {
                .search-box input {
                    min-width: auto;
                    width: 100%;
                    padding: 0.5rem;
                }
            }

            .clear-search-btn {
                position: absolute;
                right: 10px;
                background: none;
                border: none;
                color: var(--accent);
                font-size: 1.5rem;
                cursor: pointer;
                display: none;
                padding: 0;
                width: 24px;
                height: 24px;
                line-height: 24px;
                text-align: center;
            }

            .clear-search-btn:hover {
                color: var(--white);
            }

            .search-box input:not(:placeholder-shown) + .clear-search-btn {
                display: block;
            }

            .filter-tags {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .filter-btn {
                background: var(--black);
                color: var(--accent);
                border: 2px solid var(--accent);
                padding: 0.5rem 1rem;
                cursor: pointer;
                transition: all 0.3s ease;
            }

            .filter-btn:hover,
            .filter-btn.active {
                background: var(--accent);
                color: var(--black);
            }

            .sort-options select {
                padding: 0.5rem 1rem;
                border: 2px solid var(--accent);
                background: var(--black);
                color: var(--white);
            }

            .location-filters {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
                margin-top: 1rem;
                width: 100%;
            }

            .location-buttons {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
                width: 100%;
                justify-content: center;
            }

            .location-btn {
                background: var(--black);
                color: var(--earth1);
                border: 2px solid var(--earth1);
                padding: 0.5rem 1rem;
                cursor: pointer;
                transition: all 0.3s ease;
            }

            .location-btn:hover,
            .location-btn.active {
                background: var(--earth1);
                color: var(--black);
            }

            @media (max-width: 768px) {
                .filter-controls {
                    flex-direction: column;
                    align-items: stretch;
                }

                .search-box input {
                    width: 100%;
                }
            }

            /* Bookstore count and no results styling */
            .bookstore-count {
                text-align: center;
                margin-bottom: 1rem;
                color: var(--earth1);
            }

            .no-results {
                text-align: center;
                padding: 2rem;
                color: var(--white);
            }

            .bookstore-card.highlighted {
                transform: translateY(-10px);
                border-left-color: var(--accent);
                box-shadow:
                    -8px 8px 0 var(--earth1),
                    -16px 16px 0 var(--accent3);
                transition: all 0.3s ease;
            }

            .view-on-map-btn {
                display: block;
                width: fit-content;
                margin: 0 0 1rem 0;
                background: var(--earth2);
                color: var(--white);
                border: none;
                padding: 0.5rem 1rem;
                cursor: pointer;
                transition: all 0.3s ease;
                font-size: 0.9rem;
                text-transform: uppercase;
            }

            .view-on-map-btn:hover {
                background: var(--earth1);
            }

            /* Add button container styling */
            .button-container {
                margin-top: auto;
                padding-top: 1rem;
            }
        </style>
    </head>

            // Function to create bookstore card HTML
            function createBookstoreCard(bookstore) {
                const card = document.createElement('div');
                card.className = 'bookstore-card';
                if (bookstore.coordinates) {
                    card.dataset.coords = JSON.stringify(bookstore.coordinates);
                }

                let html = `
                    <h3 class="bookstore-name">${bookstore.name}</h3>
                `;

                if (bookstore.address) {
                    html += `<p class="bookstore-address">${bookstore.address}</p>`;
                }

                if (bookstore.googleMapsLink) {
                    html += `
                        <a href="${bookstore.googleMapsLink}" target="_blank" class="google-maps-link">Open in Google Maps →</a>
                    `;
                }

                if (bookstore.tags && bookstore.tags.length > 0) {
                    html += '<div class="tag-container">';
                    bookstore.tags.forEach(tag => {
                        html += `<span class="tag">${tag}</span>`;
                    });
                    html += '</div>';
                }

                if (bookstore.reviews && bookstore.reviews.length > 0) {
                    html += '<div class="reviews-section"><div class="reviews-container">';
                    bookstore.reviews.forEach(review => {
                        html += `
                            <div class="review">
                                <p class="review-text">"${review.text}"</p>
                                <p class="reviewer">— ${review.reviewer}</p>
                            </div>
                        `;
                    });
                    html += '</div></div>';
                }

                card.innerHTML = html;
                return card;
            }

            // Render all bookstores from DATA
            const bookstoreList = document.querySelector('.bookstore-list');

                height: 30px;
                background: #94A684;
                border: 3px solid #E4C988;
                transform: rotate(45deg);
                cursor: pointer;
                box-shadow: 0 0 10px rgba(164, 126, 59, 0.5);
            "></div>
        `;

            // Store all bookstore cards and their data for filtering
            const bookstores = [];
            const markers = [];

            document.querySelectorAll(".bookstore-card").forEach((card) => {
                const hasCoords = card.dataset.coords;
                const name = card.querySelector(".bookstore-name").textContent;
                const addressEl = card.querySelector(".bookstore-address");
                const address = addressEl ? addressEl.textContent : "";
                const tags = Array.from(card.querySelectorAll(".tag")).map(
                    (tag) => tag.textContent.toLowerCase(),
                );

                let marker = null;
                let coords = null;

                if (hasCoords) {
                    coords = JSON.parse(card.dataset.coords);

                    // Create marker
                    marker = new mapboxgl.Marker({
                        element: createCustomMarker(),
                    })
                        .setLngLat(coords)
                        .setPopup(
                            new mapboxgl.Popup().setHTML(`
                    <h3 style="color: #54442B; font-size: 1.2rem; margin-bottom: 0.5rem;">
                        ${name}
                    </h3>
                    <p style="color: #A47E3B; font-family: monospace;">
                        ${address}
                    </p>
                    <button class="view-details-btn" data-bookstore="${name}" style="
                        background: #94A684;
                        color: white;
                        border: none;
                        padding: 5px 10px;
                        margin-top: 8px;
                        cursor: pointer;
                        font-size: 0.9rem;
                        border-radius: 2px;
                    ">View details</button>
                `),
                        )
                        .addTo(map);

                    markers.push(marker);
                }

                // Store bookstore data
                bookstores.push({
                    element: card,
                    name: name,
                    address: address,
                    tags: tags,
                    coords: coords,
                    marker: marker,
                });

                // Add view on map button to card only if it has coordinates
                const googleMapsLink = card.querySelector(".google-maps-link");

                if (hasCoords) {
                    const mapButton = document.createElement("button");
                    mapButton.className = "view-on-map-btn";
                    mapButton.textContent = "Locate on Map";

                    // Create button container
                    const buttonContainer = document.createElement("div");
                    buttonContainer.className = "button-container";

                    // Add buttons to container
                    buttonContainer.appendChild(mapButton);
                    if (googleMapsLink) {
                        card.removeChild(googleMapsLink); // Remove from original position
                        buttonContainer.appendChild(googleMapsLink);
                    }

                    // Add container to card
                    card.appendChild(buttonContainer);

                    // Move click handler to the button instead of the card
                    mapButton.addEventListener("click", () => {
                        // Close all open popups first
                        markers.forEach((m) => {
                            if (m.getPopup().isOpen()) {
                                m.togglePopup();
                            }
                        });

                        map.flyTo({
                            center: coords,
                            zoom: 15,
                            essential: true,
                        });

                        // Remove highlight from all cards
                        document
                            .querySelectorAll(".bookstore-card")
                            .forEach((c) => {
                                c.classList.remove("highlighted");
                            });

                        // Add highlight to this card
                        card.classList.add("highlighted");

                        if (isTouchDevice()) {
                            setTimeout(() => {
                                document
                                    .querySelector(".map-section")
                                    .scrollIntoView({
                                        behavior: "smooth",
                                        block: "start",
                                    });
                            }, 300);
                        }
                        marker.togglePopup();
                    });
                } else if (googleMapsLink) {
                    // For bookstores without coordinates, just move the Google Maps link to a container
                    const buttonContainer = document.createElement("div");
                    buttonContainer.className = "button-container";
                    card.removeChild(googleMapsLink);
                    buttonContainer.appendChild(googleMapsLink);
                    card.appendChild(buttonContainer);
                }
            });

            function createCustomMarker() {
                const el = document.createElement("div");
                el.innerHTML = markerHtml;
                return el.firstElementChild;
            }

            // Add a global click handler for the "View details" buttons in popups
            document.addEventListener("click", function (e) {
                if (
                    e.target &&
                    e.target.classList.contains("view-details-btn")
                ) {
                    const bookstoreName =
                        e.target.getAttribute("data-bookstore");
                    const bookstore = bookstores.find(
                        (b) => b.name === bookstoreName,
                    );

                    if (bookstore) {
                        // Highlight the card
                        highlightBookstore(bookstore.element);

                        // Scroll to the card
                        setTimeout(() => {
                            bookstore.element.scrollIntoView({
                                behavior: "smooth",
                                block: "center",
                            });
                        }, 300);
                    }
                }
            });

            // Add filter controls to the page
            const mapSection = document.querySelector(".map-section");
            const filterContainer = document.createElement("div");
            filterContainer.className = "filter-container";
            filterContainer.innerHTML = `
            <div class="filter-controls">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Search bookstores...">
                    <button id="clear-search" class="clear-search-btn">×</button>
                </div>
                <div class="filter-tags">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="new books">new books</button>
                    <button class="filter-btn" data-filter="second hand">second hand</button>
                    <button class="filter-btn" data-filter="rare books">rare books</button>
                    <button class="filter-btn" data-filter="queer books">queer books</button>
                    <button class="filter-btn" data-filter="political books">political books</button>
                </div>
                <div class="sort-options">
                    <select id="sort-select">
                        <option value="name-asc">Name (A-Z)</option>
                        <option value="name-desc">Name (Z-A)</option>
                    </select>
                </div>
            </div>
        `;

            mapSection.insertAdjacentElement("afterend", filterContainer);

            // Filter functionality
            const searchInput = document.getElementById("search-input");
            const filterButtons = document.querySelectorAll(".filter-btn");
            const sortSelect = document.getElementById("sort-select");

            let currentFilter = "all";
            let currentSort = "name-asc";
            let searchTerm = "";
            let currentLocation = "all";

            // Add location-based filtering
            const locationFilters = document.createElement("div");
            locationFilters.className = "location-filters";
            locationFilters.innerHTML = `
            <div class="location-buttons">
                <button class="location-btn active" data-area="all">All Areas</button>
                <button class="location-btn" data-area="east">East London</button>
                <button class="location-btn" data-area="west">West London</button>
                <button class="location-btn" data-area="north">North London</button>
                <button class="location-btn" data-area="south">South London</button>
                <button class="location-btn" data-area="central">Central London</button>
            </div>
        `;

            filterContainer
                .querySelector(".filter-controls")
                .appendChild(locationFilters);

            const locationButtons = document.querySelectorAll(".location-btn");

            locationButtons.forEach((button) => {
                button.addEventListener("click", () => {
                    locationButtons.forEach((btn) =>
                        btn.classList.remove("active"),
                    );
                    button.classList.add("active");
                    currentLocation = button.dataset.area;
                    updateBookstoreList();
                });
            });

            // Define the updateBookstoreList function only once with all filtering logic
            function updateBookstoreList() {
                const bookstoreList = document.querySelector(".bookstore-list");

                // Find any currently highlighted card
                const highlightedCard = document.querySelector(
                    ".bookstore-card.highlighted",
                );
                let highlightedName = null;
                if (highlightedCard) {
                    highlightedName =
                        highlightedCard.querySelector(
                            ".bookstore-name",
                        ).textContent;
                }

                // Clear all bookstores from the list
                bookstoreList.innerHTML = "";

                // Filter bookstores
                const filteredBookstores = bookstores.filter((bookstore) => {
                    // Filter by tag
                    const tagMatch =
                        currentFilter === "all" ||
                        bookstore.tags.includes(currentFilter);

                    // Filter by search term
                    const searchMatch =
                        searchTerm === "" ||
                        bookstore.name
                            .toLowerCase()
                            .includes(searchTerm.toLowerCase()) ||
                        bookstore.address
                            .toLowerCase()
                            .includes(searchTerm.toLowerCase());

                    // Filter by location
                    const locationMatch =
                        currentLocation === "all" ||
                        (currentLocation === "east" &&
                            (bookstore.address.toLowerCase().includes("e1") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("e2") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("e3") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("e5") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("e8") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("e14"))) ||
                        (currentLocation === "west" &&
                            (bookstore.address.toLowerCase().includes("w1") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("w2") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("w6") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("w8") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("w11") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("sw3") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("sw6") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("sw7"))) ||
                        (currentLocation === "north" &&
                            (bookstore.address.toLowerCase().includes("n1") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("n5") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("n10") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("nw1") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("nw3") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("nw5") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("nw6") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("nw11"))) ||
                        (currentLocation === "south" &&
                            (bookstore.address.toLowerCase().includes("se1") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("se3") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("se5") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("se8") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("se14") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("se22") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("sw12"))) ||
                        (currentLocation === "central" &&
                            (bookstore.address.toLowerCase().includes("wc1") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("wc2") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("ec1") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("ec2") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("ec3") ||
                                bookstore.address
                                    .toLowerCase()
                                    .includes("ec4")));

                    // Update marker visibility (only for bookstores with markers)
                    if (bookstore.marker) {
                        if (tagMatch && searchMatch && locationMatch) {
                            bookstore.marker.getElement().style.display = "block";
                        } else {
                            bookstore.marker.getElement().style.display = "none";
                        }
                    }

                    return tagMatch && searchMatch && locationMatch;
                });

                // Sort bookstores
                filteredBookstores.sort((a, b) => {
                    if (currentSort === "name-asc") {
                        return a.name.localeCompare(b.name);
                    } else if (currentSort === "name-desc") {
                        return b.name.localeCompare(a.name);
                    }
                    return 0;
                });

                // Add filtered and sorted bookstores to the list
                filteredBookstores.forEach((bookstore) => {
                    bookstoreList.appendChild(bookstore.element);

                    // Re-apply highlight if this was the highlighted card
                    if (highlightedName && bookstore.name === highlightedName) {
                        bookstore.element.classList.add("highlighted");
                    }
                });

                // Update count
                const countElement = document.createElement("div");
                countElement.className = "bookstore-count";
                countElement.textContent = `Showing ${filteredBookstores.length} of ${bookstores.length} bookstores`;
                countElement.style.textAlign = "center";
                countElement.style.marginBottom = "1rem";
                countElement.style.color = "var(--earth1)";

                if (
                    bookstoreList.previousElementSibling &&
                    bookstoreList.previousElementSibling.classList.contains(
                        "bookstore-count",
                    )
                ) {
                    bookstoreList.previousElementSibling.remove();
                }

                bookstoreList.insertAdjacentElement(
                    "beforebegin",
                    countElement,
                );

                // If no results, show message
                if (filteredBookstores.length === 0) {
                    const noResults = document.createElement("div");
                    noResults.className = "no-results";
                    noResults.textContent =
                        "No bookstores match your criteria. Try adjusting your filters.";
                    noResults.style.textAlign = "center";
                    noResults.style.padding = "2rem";
                    noResults.style.color = "var(--white)";
                    bookstoreList.appendChild(noResults);
                }
            }

            // Event listeners
            const clearSearchBtn = document.getElementById("clear-search");
            clearSearchBtn.addEventListener("click", () => {
                searchInput.value = "";
                searchTerm = "";
                updateBookstoreList();
                searchInput.focus();
            });

            searchInput.addEventListener("input", (e) => {
                searchTerm = e.target.value;
                updateBookstoreList();
                clearSearchBtn.style.display = searchTerm ? "block" : "none";
            });

            filterButtons.forEach((button) => {
                button.addEventListener("click", () => {
                    filterButtons.forEach((btn) =>
                        btn.classList.remove("active"),
                    );
                    button.classList.add("active");
                    currentFilter = button.dataset.filter;
                    updateBookstoreList();
                });
            });

            sortSelect.addEventListener("change", (e) => {
                currentSort = e.target.value;
                updateBookstoreList();
            });

            // Initial update
            updateBookstoreList();

            map.scrollZoom.disable();
            map.addControl(new mapboxgl.NavigationControl());

            // Add scroll zoom toggle functionality
            const scrollZoomToggle =
                document.getElementById("scroll-zoom-toggle");
            let scrollZoomEnabled = false;

            // Check if device has touch capability
            const isTouchDevice = () => {
                return (
                    "ontouchstart" in window ||
                    navigator.maxTouchPoints > 0 ||
                    navigator.msMaxTouchPoints > 0
                );
            };

            // Hide the button on touch devices
            if (isTouchDevice()) {
                scrollZoomToggle.style.display = "none";
            } else {
                scrollZoomToggle.addEventListener("click", () => {
                    if (scrollZoomEnabled) {
                        map.scrollZoom.disable();
                        scrollZoomToggle.textContent = "Enable Scroll Zoom";
                        scrollZoomEnabled = false;
                    } else {
                        map.scrollZoom.enable();
                        scrollZoomToggle.textContent = "Disable Scroll Zoom";
                        scrollZoomEnabled = true;
                    }
                });
            }

            // Add this function to handle highlighting
            function highlightBookstore(card) {
                // Remove highlight from all cards
                document.querySelectorAll(".bookstore-card").forEach((c) => {
                    c.classList.remove("highlighted");
                });

                // Add highlight to this card
                card.classList.add("highlighted");

                // Remove highlight after a few seconds
                setTimeout(() => {
                    card.classList.remove("highlighted");
                }, 3000);
            }
        </script>
    </body>
</html>
